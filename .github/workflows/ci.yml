name: CI

on:
  push:
    # Validate a commit on a working branch before advancing protected main.
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@5eea8caf49c844361c1e9ddc1324e179c54b58e9 # v6
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit high severity dependencies
        run: pnpm audit --audit-level high
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck configuration
        run: pnpm typecheck:config
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Setup Node.js for Codex protocol fixtures
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check
        run: cargo check --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Audit dependencies
        run: cargo audit --file Cargo.lock
      - name: Regression for the GTK GLib security backport (optimized)
        run: cargo test --manifest-path ../scripts/glib-regression/Cargo.toml --release --locked

  windows-reliability:
    name: Windows reliability
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@5eea8caf49c844361c1e9ddc1324e179c54b58e9
        with:
          version: 11.19.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-reliability-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Ensure genuine WebView2 Runtime
        shell: pwsh
        run: ./scripts/ensure-webview2-runtime.ps1
      - run: pnpm install --frozen-lockfile
      - name: Complete Windows Rust suite
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build production desktop
        run: pnpm tauri build --no-bundle
      - name: Cache successful Windows build before desktop checks
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-reliability-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Native startup failure notice without a terminal
        shell: pwsh
        run: ./scripts/startup-diagnostics-test.ps1 -Executable ./src-tauri/target/release/novelforge.exe
      - name: Real WebView2 IPC and data lifecycle smoke
        env:
          NOVELFORGE_SMOKE_STARTUP_MS: 120000
          NOVELFORGE_SMOKE_DIAGNOSTICS: tmp/windows-ipc-diagnostics
        run: node scripts/reliability-smoke-cdp.mjs
      - name: Production UI layouts and draft retention
        run: node scripts/frontend-polish-cdp.mjs
      - name: DeepSeek protocol and native UI (local fixture)
        run: node scripts/deepseek-ui-cdp.mjs
      - name: Upload synthetic UI acceptance screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-ui-${{ github.sha }}
          path: tmp/frontend-polish-ui/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload sanitized Windows IPC diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ipc-diagnostics-${{ github.sha }}
          path: tmp/windows-ipc-diagnostics/*.json
          if-no-files-found: warn
          retention-days: 7
